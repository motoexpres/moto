<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meta Market</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect SDK для привязки Tonkeeper и других кошельков -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #15151c;
            --card-border: rgba(255, 255, 255, 0.07);
            --accent-color: #8b5cf6;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --badge-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 100px;
        }

        /* Шапка в стиле Portals */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Кнопка TON Connect */
        #ton-connect {
            display: flex;
            justify-content: flex-end;
        }

        /* Баннер на главной */
        .banner {
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.15) 0%, rgba(21, 21, 28, 0) 100%);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .banner h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .banner p {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Панель управления и поиска */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .cat-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Сетка NFT Подарков 1 в 1 как Portals */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            background: var(--badge-bg);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .img-container {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0 12px;
        }

        .img-container img {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 8px;
        }

        .price-ton {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .price-usd {
            font-size: 11px;
            color: var(--text-sub);
        }

        .buy-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .buy-btn:active {
            opacity: 0.8;
        }

        /* Фиксированный футер */
        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 13, 17, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-top: 1px solid var(--card-border);
        }

        .sell-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">♾</div>
            <div class="brand-title">Meta</div>
        </div>
        <!-- Сюда встраивается кнопка Подключить Tonkeeper -->
        <div id="ton-connect"></div>
    </header>

    <div class="banner">
        <h2>Маркетплейс NFT Подарков</h2>
        <p>Покупайте и продавайте редкие атрибуты Telegram</p>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск атрибута..." oninput="filterItems()">
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">Все</button>
            <button class="cat-btn" onclick="setCategory('pepe', this)">Pepe</button>
            <button class="cat-btn" onclick="setCategory('rare', this)">Редкие</button>
        </div>
    </div>

    <div class="grid" id="itemsGrid"></div>

    <div class="footer-action">
        <button class="sell-btn" onclick="sellGift()">Продать свой NFT подарок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Инициализация TON Connect (Tonkeeper, MyTonWallet и т.д.)
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        // 2. Список актуальных NFT Подарков Telegram
        const items = [
            { 
                id: 1, 
                name: "Plush Pepe #142", 
                priceTon: 450, 
                priceUsd: 3150, 
                img: "https://nft.fragment.com/gift/plush-pepe.webp", 
                supply: "#142 / 500", 
                cat: "pepe" 
            },
            { 
                id: 2, 
                name: "Frog Pepe #892", 
                priceTon: 120, 
                priceUsd: 840, 
                img: "https://nft.fragment.com/gift/frog-pepe.webp", 
                supply: "#892 / 2.5K", 
                cat: "pepe" 
            },
            { 
                id: 3, 
                name: "Green Star #504", 
                priceTon: 85, 
                priceUsd: 595, 
                img: "https://nft.fragment.com/gift/green-star.webp", 
                supply: "#504 / 5K", 
                cat: "rare" 
            },
            { 
                id: 4, 
                name: "Santa Hat #12", 
                priceTon: 310, 
                priceUsd: 2170, 
                img: "https://nft.fragment.com/gift/santa-hat.webp", 
                supply: "#12 / 1K", 
                cat: "rare" 
            },
            { 
                id: 5, 
                name: "Diamond Ring #340", 
                priceTon: 65, 
                priceUsd: 455, 
                img: "https://nft.fragment.com/gift/diamond-ring.webp", 
                supply: "#340 / 10K", 
                cat: "rare" 
            },
            { 
                id: 6, 
                name: "Golden Skull #99", 
                priceTon: 500, 
                priceUsd: 3500, 
                img: "https://nft.fragment.com/gift/golden-skull.webp", 
                supply: "#99 / 250", 
                cat: "rare" 
            }
        ];

        let currentCategory = 'all';

        function renderGrid(data) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="badge">${item.supply}</span>
                        </div>
                        <div class="img-container">
                            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://nft.fragment.com/gift/green-star.webp'">
                        </div>
                        <div class="card-title">${item.name}</div>
                        <div class="price-box">
                            <span class="price-ton">${item.priceTon} TON</span>
                            <span class="price-usd">$${item.priceUsd}</span>
                        </div>
                        <button class="buy-btn" onclick="buyItem('${item.name}', ${item.priceTon})">Купить</button>
                    </div>
                `;
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = (currentCategory === 'all') || (item.cat === currentCategory);
                return matchesSearch && matchesCat;
            });
            renderGrid(filtered);
        }

        function setCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            filterItems();
        }

        // Покупка через привязанный кошелек TON
        async function buyItem(name, priceTon) {
            if (!tonConnectUI.connected) {
                tg.showAlert('Сначала подключите ваш Tonkeeper через кнопку вверху!');
                tonConnectUI.openModal();
                return;
            }

            // Транзакция вызова Tonkeeper
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [
                    {
                        address: "EQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM9c", // Твой TON кошелек
                        amount: (priceTon * 1000000000).toString() // Перевод в нанотоны
                    }
                ]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                tg.showAlert('Запрос отправлен в кошелек!');
            } catch (e) {
                console.error(e);
            }
        }

        function sellGift() {
            tg.sendData(JSON.stringify({ action: "sell" }));
        }

        renderGrid(items);
    </script>
</body>
</html>
