<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meta Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f12);
            --card-bg: var(--tg-theme-secondary-bg-color, #1a1a20);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #2ab574);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #2ab574, #0088cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-logo {
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 2px;
        }

        /* Поиск и Фильтры */
        .controls {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            background: var(--card-bg);
            color: var(--hint-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .cat-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            color: var(--hint-color);
        }

        .img-container {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }

        .img-emoji {
            font-size: 56px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price-box {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .price-uah {
            font-size: 14px;
            font-weight: 700;
            color: #2ab574;
        }

        .price-crypto {
            font-size: 11px;
            color: var(--hint-color);
        }

        .buy-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }

        /* Кнопка снизу для Telegram */
        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            padding: 12px 16px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        .sell-btn {
            width: 100%;
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">❖ META MARKET ❖</div>
        <div class="sub-logo">NFT Gifts & Collectibles</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск подарка..." oninput="filterItems()">
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">Все</button>
            <button class="cat-btn" onclick="setCategory('rare', this)">🔥 Редкие</button>
            <button class="cat-btn" onclick="setCategory('food', this)">🍔 Еда</button>
            <button class="cat-btn" onclick="setCategory('animals', this)">🐵 Животные</button>
        </div>
    </div>

    <div class="grid" id="itemsGrid"></div>

    <div class="footer-action">
        <button class="sell-btn" onclick="sellGift()">🤝 Продать свой подарок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // База подарков в наличии
        const items = [
            { id: 1, name: "IceCream #9424", priceUah: 900, priceTon: 22, emoji: "🍦", cat: "food", rare: false },
            { id: 2, name: "Red Chimpanzee", priceUah: 1500, priceTon: 37, emoji: "🐵", cat: "animals", rare: true },
            { id: 3, name: "Juicy Watermelon", priceUah: 800, priceTon: 20, emoji: "🍉", cat: "food", rare: false },
            { id: 4, name: "Doberman Dog", priceUah: 1200, priceTon: 30, emoji: "🐕", cat: "animals", rare: true },
            { id: 5, name: "Magic Unicorn", priceUah: 1800, priceTon: 45, emoji: "🦄", cat: "rare", rare: true },
            { id: 6, name: "Jester Hat", priceUah: 750, priceTon: 18, emoji: "🤡", cat: "rare", rare: false }
        ];

        let currentCategory = 'all';

        function renderGrid(data) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <span class="badge">1 of ${item.cat === 'rare' ? '10k' : '50k'}</span>
                        <div class="img-container">
                            <span class="img-emoji">${item.emoji}</span>
                        </div>
                        <div class="card-title">${item.name}</div>
                        <div class="price-box">
                            <span class="price-uah">${item.priceUah} UAH</span>
                            <span class="price-crypto">~${item.priceTon} TON</span>
                        </div>
                        <button class="buy-btn" onclick="buyItem('${item.name}', ${item.priceUah})">Купить</button>
                    </div>
                `;
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = (currentCategory === 'all') || 
                                   (currentCategory === 'rare' && item.rare) || 
                                   (item.cat === currentCategory);
                return matchesSearch && matchesCat;
            });
            renderGrid(filtered);
        }

        function setCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            filterItems();
        }

        function buyItem(name, price) {
            // Отправка данных боту при нажатии "Купить"
            tg.sendData(JSON.stringify({
                action: "buy",
                item: name,
                price: price
            }));
        }

        function sellGift() {
            // Отправка данных боту для заявки на продажу
            tg.sendData(JSON.stringify({
                action: "sell"
            }));
        }

        // Первичный рендер
        renderGrid(items);
    </script>
</body>
</html>
