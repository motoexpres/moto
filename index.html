<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meta Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0914;
            --card-bg: #181225;
            --accent-purple: #8b5cf6;
            --text-color: #ffffff;
            --hint-color: #a78bfa;
            --button-color: #7c3aed;
            --button-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .sub-logo {
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            background: var(--card-bg);
            color: var(--hint-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .cat-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: var(--button-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(139, 92, 246, 0.15);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            color: #ddd6fe;
        }

        .img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .img-container img {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin: 10px 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price-box {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .price-ton {
            font-size: 15px;
            font-weight: 800;
            color: #a78bfa;
        }

        .price-usd {
            font-size: 11px;
            color: #8b5cf6;
        }

        .buy-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .buy-btn:active {
            transform: scale(0.97);
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 9, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .sell-btn {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">♾ META MARKET</div>
        <div class="sub-logo">Telegram NFT Gifts & Collectibles</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск NFT Подарка..." oninput="filterItems()">
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">Все подарки</button>
            <button class="cat-btn" onclick="setCategory('pepe', this)">🐸 Pepe</button>
            <button class="cat-btn" onclick="setCategory('rare', this)">🔥 Топ Раритеты</button>
        </div>
    </div>

    <div class="grid" id="itemsGrid"></div>

    <div class="footer-action">
        <button class="sell-btn" onclick="sellGift()">🤝 Продать свой NFT подарок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Настоящие NFT подарки из Telegram
        const items = [
            { 
                id: 1, 
                name: "Plush Pepe #142", 
                priceTon: "450 TON", 
                priceUsd: "~$3,150", 
                img: "https://nft.fragment.com/gift/plush-pepe.webp", 
                supply: "1 of 500", 
                cat: "pepe" 
            },
            { 
                id: 2, 
                name: "Frog Pepe #892", 
                priceTon: "120 TON", 
                priceUsd: "~$840", 
                img: "https://nft.fragment.com/gift/frog-pepe.webp", 
                supply: "1 of 2,500", 
                cat: "pepe" 
            },
            { 
                id: 3, 
                name: "Green Star #504", 
                priceTon: "85 TON", 
                priceUsd: "~$595", 
                img: "https://nft.fragment.com/gift/green-star.webp", 
                supply: "1 of 5,000", 
                cat: "rare" 
            },
            { 
                id: 4, 
                name: "Santa Hat #12", 
                priceTon: "310 TON", 
                priceUsd: "~$2,170", 
                img: "https://nft.fragment.com/gift/santa-hat.webp", 
                supply: "1 of 1,000", 
                cat: "rare" 
            },
            { 
                id: 5, 
                name: "Diamond Ring #340", 
                priceTon: "65 TON", 
                priceUsd: "~$455", 
                img: "https://nft.fragment.com/gift/diamond-ring.webp", 
                supply: "1 of 10,000", 
                cat: "rare" 
            },
            { 
                id: 6, 
                name: "Golden Skull #99", 
                priceTon: "500 TON", 
                priceUsd: "~$3,500", 
                img: "https://nft.fragment.com/gift/golden-skull.webp", 
                supply: "1 of 250", 
                cat: "rare" 
            }
        ];

        let currentCategory = 'all';

        function renderGrid(data) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <span class="badge">${item.supply}</span>
                        <div class="img-container">
                            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://nft.fragment.com/gift/green-star.webp'">
                        </div>
                        <div class="card-title">${item.name}</div>
                        <div class="price-box">
                            <span class="price-ton">${item.priceTon}</span>
                            <span class="price-usd">${item.priceUsd}</span>
                        </div>
                        <button class="buy-btn" onclick="buyItem('${item.name}', '${item.priceTon}')">Купить</button>
                    </div>
                `;
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = (currentCategory === 'all') || (item.cat === currentCategory);
                return matchesSearch && matchesCat;
            });
            renderGrid(filtered);
        }

        function setCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            filterItems();
        }

        function buyItem(name, price) {
            tg.sendData(JSON.stringify({
                action: "buy",
                item: name,
                price: price
            }));
        }

        function sellGift() {
            tg.sendData(JSON.stringify({
                action: "sell"
            }));
        }

        renderGrid(items);
    </script>
</body>
</html>
